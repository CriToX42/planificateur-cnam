name: Relire les diplômes

on:
  schedule:
    - cron: "17 5 * * 1" # chaque lundi vers 7 h, heure de Paris
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Relire chaque fiche et créer une version si le programme a changé
        run: uv run --no-dev python -m cnam refresh

      # Le commit hebdomadaire (au moins la date de vérification) garde aussi la tâche planifiée active.
      - name: Enregistrer et republier
        run: |
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Relecture hebdomadaire des diplômes"
          git pull --rebase
          git push
          gh workflow run pages.yml --ref main
