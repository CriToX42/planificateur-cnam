name: Découvrir et relire les diplômes

on:
  schedule:
    - cron: "17 5 * * 1" # chaque lundi vers 7 h, heure de Paris
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # premier passage : ~1 500 pages à 1 requête par seconde
    env:
      TZ: Europe/Paris
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Lire le sitemap, classer les nouvelles pages, relire les fiches diplôme
        run: uv run --no-dev python -m cnam crawl

      # Le commit hebdomadaire (au moins les dates de vérification) garde aussi la tâche planifiée active.
      - name: Enregistrer et republier
        run: |
          git add site/data crawl
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW=$(git diff --cached --name-only --diff-filter=A -- site/data/maquettes | wc -l)
          git commit -m "Diplômes du Cnam Paris : $NEW nouvelle(s) maquette(s)"
          git pull --rebase
          git push
          gh workflow run pages.yml --ref main
